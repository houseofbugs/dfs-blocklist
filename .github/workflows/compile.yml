name: Compile DFS Unified Blocklists (AdGuard & UDM)

on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile AdGuard blocklist
        run: npx -y @adguard/hostlist-compiler -c configuration.json -o raw-blocklist.txt

      - name: Fetch and process LOLRMM feed
        run: |
          python3 - <<'EOF'
          import csv
          import datetime
          import io
          import re
          import urllib.request

          URLS = [
              "https://lolrmm.io/api/rmm_domains.csv",
              "https://raw.githubusercontent.com/magicsword-io/LOLRMM/main/website/public/api/rmm_domains.csv",
          ]

          csv_text = None
          last_err = None
          for url in URLS:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "DFS-Blocklist-Compiler/1.0"})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      csv_text = resp.read().decode("utf-8-sig")
                  print(f"Fetched LOLRMM CSV from {url}")
                  break
              except Exception as exc:
                  last_err = exc
                  print(f"Warning: failed to fetch {url}: {exc}")

          if not csv_text:
              raise RuntimeError(f"Unable to fetch LOLRMM feed: {last_err}")

          def read_active_lines(path):
              items = []
              try:
                  with open(path, "r", encoding="utf-8") as fh:
                      for raw in fh:
                          line = raw.strip()
                          if not line or line.startswith("!") or line.startswith("#"):
                              continue
                          items.append(line)
              except FileNotFoundError:
                  pass
              return items

          def normalize_domain_or_ip(rule):
              val = rule.strip().lower()
              val = re.sub(r"^@@", "", val)
              val = re.sub(r"^\|\|", "", val)
              val = re.sub(r"\^.*$", "", val)
              return val.strip()

          sanctioned_raw = read_active_lines("sanctioned-rmm.txt")
          sanctioned_terms = [s.lower() for s in sanctioned_raw]

          user_allow = set()
          for path in ("custom-allow.txt", "exclusions.txt"):
              for line in read_active_lines(path):
                  norm = normalize_domain_or_ip(line)
                  if norm:
                      user_allow.add(norm)

          ip_re = re.compile(r"^(\d{1,3}\.){3}\d{1,3}(/\d{1,2})?$")
          domain_re = re.compile(r"^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$")

          def is_sanctioned(clean_uri, tool):
              for term in sanctioned_terms:
                  if term == tool:
                      return True
                  if re.search(r"(^|[\s(/_-])" + re.escape(term) + r"($|[\s)/_-])", tool):
                      return True
                  if clean_uri == term or clean_uri.endswith("." + term):
                      return True
              return False

          def add_unique(seq, seen, item):
              if item not in seen:
                  seen.add(item)
                  seq.append(item)

          sanctioned_domains_ips, seen_sanc = [], set()
          sanctioned_ag_allow, seen_sanc_ag = [], set()
          lolrmm_ag_rules, seen_ag = [], set()
          lolrmm_udm_domains, seen_udm_dom = [], set()
          lolrmm_udm_ips, seen_udm_ip = [], set()

          reader = csv.DictReader(io.StringIO(csv_text))
          for row in reader:
              uri = (row.get("URI") or "").strip().lower()
              tool = (row.get("RMM_Tool") or "").strip().lower()
              if not uri:
                  continue
              clean_uri = uri[2:] if uri.startswith("*.") else uri
              clean_uri = clean_uri.rstrip(".")
              if not clean_uri:
                  continue

              if is_sanctioned(clean_uri, tool):
                  if "*" not in clean_uri and (ip_re.match(clean_uri) or domain_re.match(clean_uri)):
                      add_unique(sanctioned_domains_ips, seen_sanc, clean_uri)
                      add_unique(sanctioned_ag_allow, seen_sanc_ag, f"@@||{clean_uri}^$important")
                  continue

              if clean_uri in user_allow:
                  continue

              add_unique(lolrmm_ag_rules, seen_ag, f"||{clean_uri}^")
              if ip_re.match(clean_uri):
                  add_unique(lolrmm_udm_ips, seen_udm_ip, clean_uri)
              elif "*" not in clean_uri and domain_re.match(clean_uri):
                  add_unique(lolrmm_udm_domains, seen_udm_dom, clean_uri)

          if not lolrmm_ag_rules or not lolrmm_udm_domains:
              raise RuntimeError("LOLRMM processing produced unexpected empty ruleset.")

          with open("sanctioned-domains-ips.txt", "w", encoding="utf-8", newline="\n") as fh:
              if sanctioned_domains_ips:
                  fh.write("\n".join(sanctioned_domains_ips) + "\n")

          with open("sanctioned-adguard-allow.txt", "w", encoding="utf-8", newline="\n") as fh:
              if sanctioned_ag_allow:
                  fh.write("\n".join(sanctioned_ag_allow) + "\n")

          with open("lolrmm-adguard-rules.txt", "w", encoding="utf-8", newline="\n") as fh:
              fh.write("\n".join(lolrmm_ag_rules) + "\n")

          with open("lolrmm-udm-domains.txt", "w", encoding="utf-8", newline="\n") as fh:
              fh.write("\n".join(lolrmm_udm_domains) + "\n")

          with open("lolrmm-udm-ips.txt", "w", encoding="utf-8", newline="\n") as fh:
              if lolrmm_udm_ips:
                  fh.write("\n".join(lolrmm_udm_ips) + "\n")

          updated_at = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          sanctioned_label = ", ".join(sanctioned_raw) if sanctioned_raw else "none"
          with open("lolrmm-adguard.txt", "w", encoding="utf-8", newline="\n") as fh:
              fh.write("! Title: DFS LOLRMM Unauthorized RMM Blocklist\n")
              fh.write("! Description: Blocks unauthorized Remote Monitoring & Management (RMM) domains/IPs from https://lolrmm.io, excluding DFS sanctioned tools.\n")
              fh.write("! Homepage: https://github.com/houseofbugs/dfs-blocklist\n")
              fh.write("! License: MIT\n")
              fh.write("! Expires: 12 hours\n")
              fh.write(f"! Last modified: {updated_at}\n")
              fh.write(f"! Sanctioned tools: {sanctioned_label}\n")
              fh.write(f"! Total rules: {len(lolrmm_ag_rules)}\n")
              fh.write("!\n")
              fh.write("\n".join(lolrmm_ag_rules) + "\n")

          print(f"Sanctioned RMM entries protected: {len(sanctioned_domains_ips)}")
          print(f"LOLRMM AdGuard rules: {len(lolrmm_ag_rules)}")
          print(f"LOLRMM UDM domains: {len(lolrmm_udm_domains)}, UDM IPs: {len(lolrmm_udm_ips)}")
          EOF

      - name: Validate rule count and add metadata header
        run: |
          set -euo pipefail
          RULE_COUNT=$(grep -cEv '^\s*($|!|#)' raw-blocklist.txt || true)
          echo "Compiled upstream rule count: $RULE_COUNT"
          if [ "$RULE_COUNT" -lt 50000 ]; then
            echo "::error::Compiled rule count ($RULE_COUNT) is below minimum threshold of 50000."
            exit 1
          fi
          CUSTOM_RULES=$(cat custom-rewrites.txt custom-allow.txt custom-block.txt | tr -d '\r' | grep -Ev '^\s*($|!|#)' || true)
          CUSTOM_COUNT=$(printf '%s\n' "$CUSTOM_RULES" | grep -cEv '^\s*$' || true)
          SANC_COUNT=$(grep -cEv '^\s*($|!|#)' sanctioned-adguard-allow.txt || true)
          LOLRMM_COUNT=$(grep -cEv '^\s*($|!|#)' lolrmm-adguard-rules.txt || true)
          TOTAL_COUNT=$((RULE_COUNT + CUSTOM_COUNT + SANC_COUNT + LOLRMM_COUNT))
          UPDATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          {
            echo "! Title: DFS Unified Blocklist (AdGuard Home)"
            echo "! Description: Unified auto-updating DNS and firewall blocklist (Ads, Trackers, Malware, Phishing, C2 & Unauthorized RMM) for DFS and client deployments."
            echo "! Homepage: https://github.com/houseofbugs/dfs-blocklist"
            echo "! License: MIT"
            echo "! Expires: 12 hours"
            echo "! Last modified: $UPDATED_AT"
            echo "! Total rules: $TOTAL_COUNT"
            echo "!"
            if [ -n "$CUSTOM_RULES" ]; then
              echo "! --- DFS Custom Rules & DNS Rewrites ---"
              printf '%s\n' "$CUSTOM_RULES"
              echo "!"
            fi
            if [ -s sanctioned-adguard-allow.txt ]; then
              echo "! --- DFS Sanctioned RMM Allowlist ---"
              cat sanctioned-adguard-allow.txt
              echo "!"
            fi
            if [ -s lolrmm-adguard-rules.txt ]; then
              echo "! --- DFS LOLRMM Unauthorized RMM Blocklist ---"
              cat lolrmm-adguard-rules.txt
              echo "!"
            fi
            cat raw-blocklist.txt
          } > blocklist.txt
          ls -lh blocklist.txt lolrmm-adguard.txt

      - name: Build UDM/UCG plain-text domain and IP lists
        run: |
          set -euo pipefail

          # 1. Build normalized allow/exclusion set (domains and IPs, including sanctioned RMMs)
          cat custom-allow.txt exclusions.txt sanctioned-domains-ips.txt \
            | tr -d '\r' \
            | grep -Ev '^\s*($|!|#)' \
            | sed -E 's/^@@\|\|//; s/^\|\|//; s/\^.*$//; s/\s+$//' \
            | tr '[:upper:]' '[:lower:]' \
            | grep -Ev '^\s*$' \
            | sort -u > allow-set.txt || true

          filter_allowed() {
            if [ -s allow-set.txt ]; then
              grep -vxFf allow-set.txt || true
            else
              cat
            fi
          }

          # 2. Extract custom blocked domains & custom blocked IPs/CIDRs from custom-block.txt
          cat custom-block.txt \
            | tr -d '\r' \
            | grep -Ev '^\s*($|!|#)' \
            | sed -E 's/^\|\|//; s/\^.*$//; s/\s+$//' \
            | tr '[:upper:]' '[:lower:]' > custom-block-clean.txt || true

          grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$' custom-block-clean.txt > custom-ips.txt || true
          grep -E '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$' custom-block-clean.txt \
            | grep -Ev '^([0-9]{1,3}\.){3}[0-9]{1,3}$' > custom-domains.txt || true

          # 3. Build UDM High-Confidence Threat + LOLRMM Domain List (udm-domains.txt, capped at 9500 entries)
          curl -fsSL "https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-agh-online.txt" > udm-threat-raw.txt
          curl -fsSL "https://raw.githubusercontent.com/DandelionSprout/adfilt/master/Alternate%20versions%20Anti-Malware%20List/AntiMalwareAdGuardHome.txt" >> udm-threat-raw.txt
          curl -fsSL "https://malware-filter.gitlab.io/malware-filter/phishing-filter-agh.txt" >> udm-threat-raw.txt

          cat udm-threat-raw.txt \
            | tr -d '\r' \
            | grep -E '^\|\|[a-zA-Z0-9.-]+\^$' \
            | sed -E 's/^\|\|//; s/\^$//' \
            | tr '[:upper:]' '[:lower:]' \
            | grep -E '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$' \
            | grep -Ev '^([0-9]{1,3}\.){3}[0-9]{1,3}$' > udm-threat-domains.txt

          cat custom-domains.txt lolrmm-udm-domains.txt udm-threat-domains.txt \
            | awk '!seen[$0]++' \
            | filter_allowed > udm-domains-capped-src.tmp

          head -n 9500 udm-domains-capped-src.tmp > udm-domains.txt

          # 4. Build UDM Full Plain Domain List (udm-domains-full.txt)
          cat raw-blocklist.txt \
            | tr -d '\r' \
            | grep -E '^\|\|[a-zA-Z0-9.-]+\^$' \
            | sed -E 's/^\|\|//; s/\^$//' \
            | tr '[:upper:]' '[:lower:]' \
            | grep -E '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$' \
            | grep -Ev '^([0-9]{1,3}\.){3}[0-9]{1,3}$' > full-extracted-domains.txt

          cat custom-domains.txt lolrmm-udm-domains.txt full-extracted-domains.txt \
            | awk '!seen[$0]++' \
            | filter_allowed > udm-domains-full.txt

          # 5. Build UDM Threat + LOLRMM IP/CIDR Lists (udm-ips.txt capped at 9500, and udm-ips-full.txt)
          curl -fsSL "https://www.spamhaus.org/drop/drop.txt" \
            | tr -d '\r' \
            | grep -Ev '^\s*($|;)' \
            | sed -E 's/\s*;.*$//; s/\s+$//' \
            | grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$' > spamhaus-drop.txt

          curl -fsSL "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/ips/tif.txt" \
            | tr -d '\r' \
            | grep -Ev '^\s*($|#|!)' \
            | sed -E 's/\s+$//' \
            | grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$' > hagezi-tif-ips.txt

          cat custom-ips.txt lolrmm-udm-ips.txt spamhaus-drop.txt hagezi-tif-ips.txt \
            | awk '!seen[$0]++' \
            | filter_allowed > udm-ips-full.txt

          head -n 9500 udm-ips-full.txt > udm-ips.txt

          if [ ! -s udm-domains.txt ] || [ ! -s udm-ips.txt ]; then
            echo "::error::Generated UDM domain or IP list is empty."
            exit 1
          fi

          echo "UDM domain list count: $(wc -l < udm-domains.txt)"
          echo "UDM full domain list count: $(wc -l < udm-domains-full.txt)"
          echo "UDM IP list count: $(wc -l < udm-ips.txt)"
          echo "UDM full IP list count: $(wc -l < udm-ips-full.txt)"

      - name: Publish blocklists to dist branch
        run: |
          set -euo pipefail
          PUBLISH_DIR=$(mktemp -d)
          cp blocklist.txt "$PUBLISH_DIR/blocklist.txt"
          cp udm-domains.txt "$PUBLISH_DIR/udm-domains.txt"
          cp udm-ips.txt "$PUBLISH_DIR/udm-ips.txt"
          cp udm-domains-full.txt "$PUBLISH_DIR/udm-domains-full.txt"
          cp udm-ips-full.txt "$PUBLISH_DIR/udm-ips-full.txt"
          cp lolrmm-adguard.txt "$PUBLISH_DIR/lolrmm-adguard.txt"
          cp lolrmm-udm-domains.txt "$PUBLISH_DIR/lolrmm-udm-domains.txt"
          cp lolrmm-udm-ips.txt "$PUBLISH_DIR/lolrmm-udm-ips.txt"
          cp README.md "$PUBLISH_DIR/README.md"
          cd "$PUBLISH_DIR"
          git init -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blocklist.txt udm-domains.txt udm-ips.txt udm-domains-full.txt udm-ips-full.txt lolrmm-adguard.txt lolrmm-udm-domains.txt lolrmm-udm-ips.txt README.md
          git commit -m "Update compiled blocklists ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin dist
